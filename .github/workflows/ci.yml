name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -e ".[test]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: pytest
      - name: Performance benchmark (AC-5, informational)
        # Runs the benchmark and prints the speedup (exercises the parallel
        # engine on CI). Informational: it does not fail the build on the ratio,
        # since shared runners have few/noisy cores. The hard >=3x gate is
        # `python benchmarks/run.py --assert-speedup` on a real >=4-core machine.
        run: python benchmarks/run.py --candidates 20000 --iterations 400 --log-lines 100000

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint Bash scripts
        run: |
          shopt -s globstar nullglob
          shellcheck Forensics/Bash/*.sh Forensics/docker/**/*.sh

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path Forensics/Powershell -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
