[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # line length is enforced by the formatter, not worth failing lint over
]

[tool.ruff.lint.per-file-ignores]
"Forensics/Volatility Plugins/*.py" = ["UP"] # third-party framework plugins; leave their style alone beyond hygiene fixes
