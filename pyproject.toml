[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secscripts"
version = "1.0.0"
description = "Shared CLI/output/logging/hashing helpers for the Security-Scripts tools"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
# Tools that need extras import them directly; this lets `pip install -e .[dev]`
# pull the test runner without touching the repo-wide requirements.txt.
dev = ["pytest>=8"]
# Everything CI needs to collect and run the test suite: pytest plus the
# third-party runtime deps the in-scope tools import at load time. Deliberately
# excludes the heavy/legacy deps that don't build on modern Python
# (dpkt_fix, pytsk3) and the Py2 volatility framework — the code imports those
# lazily, and the Volatility plugins are tested statically (AST), so the suite
# runs without them.
test = [
    "pytest>=8",
    "PyYAML==6.0.2",
    "python-docx==1.2.0",
    "Requests==2.34.2",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "XlsxWriter==3.2.9",
    "passlib==1.7.4",
    "Faker==40.36.0",
]

[tool.setuptools]
# The repo is a grab-bag of standalone scripts; only the shared helper is a
# real importable package, so package discovery is pinned to it explicitly.
packages = ["secscripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # line length is enforced by the formatter, not worth failing lint over
]

[tool.ruff.lint.per-file-ignores]
"Forensics/Volatility Plugins/*.py" = ["UP"] # third-party framework plugins; leave their style alone beyond hygiene fixes
"Malware/*.py" = ["UP"] # out of scope (spec non-goal: left untouched); exempt from py311 modernization rewrites
